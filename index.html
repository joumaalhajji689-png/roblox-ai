
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roblox AI</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; font-family: Arial, sans-serif;
  background: #0d1020; color: white;
  min-height: 100vh; display: grid; place-items: center;
}
main {
  width: min(700px, 92%); padding: 28px;
  background: #171b30; border: 1px solid #303654;
  border-radius: 20px;
}
.logo { font-size: 38px; margin-bottom: 8px; }
h1 { margin: 0; font-size: 32px; }
p { color: #b8c0dc; line-height: 1.6; }
textarea {
  width: 100%; min-height: 130px; padding: 15px;
  border-radius: 12px; border: 1px solid #414969;
  background: #0d1020; color: white; font: inherit;
  resize: vertical;
}
button {
  margin-top: 12px; padding: 13px 18px; border: 0;
  border-radius: 10px; background: #7657ff;
  color: white; font-weight: bold; cursor: pointer;
}
button:hover { background: #8c73ff; }
#answer {
  margin-top: 20px; padding: 15px;
  background: #0d1020; border-radius: 12px;
  white-space: pre-wrap; overflow-wrap: anywhere;
}
small { color: #8f9abb; }
</style>
</head>
<body>
<main>
  <div class="logo">🤖</div>
  <h1>Roblox AI</h1>
  <p>Deine eigene KI für Roblox-Spielideen und Skripte.</p>
  <textarea id="idea" placeholder="Beschreibe dein Spiel, z. B. Erstelle ein Pet-System mit Coins ..."></textarea>
  <button onclick="generate()">Idee vorbereiten</button>
  <div id="answer">Deine Spielidee erscheint hier.</div>
  <p><small>Version 1.0 · Dein eigenes Roblox-AI-Projekt</small></p>
</main>
<script>
function generate() {
  const idea = document.getElementById("idea").value.trim();
  const answer = document.getElementById("answer");
  if (!idea) {
    answer.textContent = "Schreibe zuerst deine Spielidee hinein.";
    return;
  }
  answer.textContent =
    "Deine Spielidee:\n\n" + idea +
    "\n\nNächster Schritt: Verbinde Roblox AI mit einem KI-Modell, " +
    "damit echte Skripte automatisch erzeugt werden können.";
}
</script>
</body>
</html>
